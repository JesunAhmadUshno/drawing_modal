<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Drawing Capture - Sprint 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #404040;
            flex-wrap: wrap;
            position: relative;
        }

        .sidebar-toggle {
            display: none;
            background: #1177bb;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-left: auto;
        }

        .sidebar-toggle:hover {
            background: #1588cc;
        }

        .tool-group {
            display: flex;
            gap: 5px;
            padding-right: 15px;
            border-right: 1px solid #404040;
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            padding: 10px 14px;
            min-width: 44px;
            min-height: 44px;
            background: #3e3e3e;
            border: 1px solid #555;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #4e4e4e;
            border-color: #666;
        }

        .tool-btn.active {
            background: #0e639c;
            border-color: #1177bb;
            color: white;
        }

        .color-palette {
            display: flex;
            gap: 5px;
        }

        .color-btn {
            width: 44px;
            height: 44px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: white;
            transform: scale(1.15);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252526;
            padding: 20px;
        }

        #drawingCanvas {
            background: white;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            border-radius: 4px;
            touch-action: none;
            display: block;
        }

        /* Side Panel */
        .side-panel {
            width: 300px;
            background: #252526;
            border-left: 1px solid #404040;
            overflow-y: auto;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .side-panel.hidden {
            transform: translateX(100%);
        }

        .panel-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #404040;
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .control-item {
            margin-bottom: 15px;
        }

        .control-item label {
            display: block;
            font-size: 12px;
            color: #cccccc;
            margin-bottom: 5px;
        }

        .control-item input[type="range"] {
            width: 100%;
            height: 4px;
            background: #3e3e3e;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #1177bb;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-item input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #1177bb;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 12px;
            color: #cccccc;
            cursor: pointer;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            color: #999;
        }

        .data-row strong {
            color: #cccccc;
        }

        .data-row span {
            font-family: 'Courier New', monospace;
            color: #4ec9b0;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #3e3e3e;
            border: 1px solid #555;
            color: #cccccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #4e4e4e;
            border-color: #666;
        }

        .action-btn.primary {
            background: #0e639c;
            border-color: #1177bb;
            color: white;
        }

        .action-btn.primary:hover {
            background: #1177bb;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Responsive Design - Media Queries */
        
        /* Large Tablets & Small Desktops (1024px and below) */
        @media (max-width: 1024px) {
            .side-panel {
                width: 260px;
            }
        }

        /* Tablets (768px and below) */
        @media (max-width: 768px) {
            .sidebar-toggle {
                display: block;
            }

            .side-panel {
                position: fixed;
                right: 0;
                top: 0;
                height: 100vh;
                width: 280px;
                z-index: 1000;
                box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            }

            .main-content {
                flex-direction: column;
            }

            .canvas-area {
                padding: 10px;
            }

            .toolbar {
                padding: 8px 15px;
                gap: 10px;
            }

            .tool-group {
                gap: 3px;
            }
        }

        /* Mobile Phones (480px and below) */
        @media (max-width: 480px) {
            .toolbar {
                padding: 5px 10px;
                gap: 5px;
            }

            .tool-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .color-btn {
                width: 38px;
                height: 38px;
            }

            .tool-group {
                padding-right: 8px;
            }

            .side-panel {
                width: 100%;
                max-width: 320px;
            }

            .panel-section h3 {
                font-size: 11px;
            }

            .action-btn {
                padding: 10px 15px;
                font-size: 13px;
            }

            .data-row {
                font-size: 11px;
            }

            .canvas-area {
                padding: 5px;
            }
        }

        /* Mobile Landscape */
        @media (max-width: 768px) and (orientation: landscape) {
            .container {
                height: 100vh;
            }

            .toolbar {
                padding: 5px 10px;
            }

            .canvas-area {
                padding: 5px;
            }

            .side-panel {
                width: 240px;
            }
        }

        /* Small phones (320px and below) */
        @media (max-width: 320px) {
            .tool-btn {
                padding: 6px 8px;
                font-size: 11px;
                min-width: 38px;
                min-height: 38px;
            }

            .color-btn {
                width: 32px;
                height: 32px;
            }

            .sidebar-toggle {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pen">Pen</button>
                <button class="tool-btn" data-tool="eraser">Eraser</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" data-shape="line">Line</button>
                <button class="tool-btn" data-shape="rectangle">Rectangle</button>
                <button class="tool-btn" data-shape="circle">Circle</button>
                <button class="tool-btn" data-shape="triangle">Triangle</button>
            </div>

            <div class="tool-group color-palette">
                <button class="color-btn active" data-color="#000000" style="background: #000000;"></button>
                <button class="color-btn" data-color="#ff0000" style="background: #ff0000;"></button>
                <button class="color-btn" data-color="#00ff00" style="background: #00ff00;"></button>
                <button class="color-btn" data-color="#0000ff" style="background: #0000ff;"></button>
                <button class="color-btn" data-color="#ffff00" style="background: #ffff00;"></button>
                <button class="color-btn" data-color="#ff00ff" style="background: #ff00ff;"></button>
                <button class="color-btn" data-color="#00ffff" style="background: #00ffff;"></button>
                <button class="color-btn" data-color="#ffa500" style="background: #ffa500;"></button>
            </div>

            <button class="sidebar-toggle" id="sidebarToggle">☰ Panel</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="canvas-area">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- Side Panel -->
            <div class="side-panel">
                <div class="panel-section">
                    <h3>Brush Settings</h3>
                    <div class="control-item">
                        <label>Size: <span id="sizeValue">12</span>px</label>
                        <input type="range" id="brushSize" min="1" max="50" value="12">
                    </div>
                    <div class="control-item">
                        <label>Opacity: <span id="opacityValue">100</span>%</label>
                        <input type="range" id="opacity" min="0" max="100" value="100">
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pressureSensitive" checked>
                        <label for="pressureSensitive">Pressure Sensitive</label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Session Data</h3>
                    <div class="data-row">
                        <strong>Session ID:</strong>
                        <span id="sessionId">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Strokes:</strong>
                        <span id="strokeCount">0</span>
                    </div>
                    <div class="data-row">
                        <strong>Total Duration:</strong>
                        <span id="totalDuration">0s</span>
                    </div>
                    <div class="data-row">
                        <strong>Active Duration:</strong>
                        <span id="activeDuration">0s</span>
                    </div>
                    <div class="data-row">
                        <strong>Pause Duration:</strong>
                        <span id="pauseDuration">0s</span>
                    </div>
                    <div class="data-row">
                        <strong>Status:</strong>
                        <span id="status">not started</span>
                    </div>
                    <div class="data-row">
                        <strong>Input:</strong>
                        <span id="inputType">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Pressure:</strong>
                        <span id="pressure">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Tilt X/Y:</strong>
                        <span id="tilt">-</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Sensors</h3>
                    <div class="data-row">
                        <strong>Accel X/Y/Z:</strong>
                        <span id="accelerometer">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Gyro X/Y/Z:</strong>
                        <span id="gyroscope">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Refresh Rate:</strong>
                        <span id="refreshRate">-</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Actions</h3>
                    <button class="action-btn" id="undoBtn">Undo</button>
                    <button class="action-btn" id="clearBtn">Clear Canvas</button>
                    <button class="action-btn primary" id="completeBtn">Complete Session</button>
                    <button class="action-btn primary" id="saveBtn">Save Session (JSON)</button>
                    <button class="action-btn" id="exportPngBtn">Export PNG</button>
                </div>
            </div>
        </div>
    </div>

    <script src="drawingCapture.js"></script>
    <script src="advanced-final.js"></script>
    <script>
        // Mobile sidebar toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidePanel = document.querySelector('.side-panel');
            
            if (sidebarToggle && sidePanel) {
                sidebarToggle.addEventListener('click', function() {
                    sidePanel.classList.toggle('hidden');
                    const isHidden = sidePanel.classList.contains('hidden');
                    sidebarToggle.textContent = isHidden ? '☰ Panel' : '✕ Close';
                });

                // Close sidebar when clicking outside on mobile
                document.addEventListener('click', function(e) {
                    if (window.innerWidth <= 768) {
                        if (!sidePanel.contains(e.target) && !sidebarToggle.contains(e.target)) {
                            if (!sidePanel.classList.contains('hidden')) {
                                sidePanel.classList.add('hidden');
                                sidebarToggle.textContent = '☰ Panel';
                            }
                        }
                    }
                });

                // Auto-hide sidebar on mobile on load
                function checkScreenSize() {
                    if (window.innerWidth <= 768) {
                        sidePanel.classList.add('hidden');
                        sidebarToggle.textContent = '☰ Panel';
                    } else {
                        sidePanel.classList.remove('hidden');
                    }
                }

                checkScreenSize();
                window.addEventListener('resize', checkScreenSize);
            }
        });
    </script>
</body>
</html>

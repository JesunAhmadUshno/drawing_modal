<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Drawing Capture - Sprint 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #404040;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            gap: 5px;
            padding-right: 15px;
            border-right: 1px solid #404040;
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            padding: 8px 12px;
            background: #3e3e3e;
            border: 1px solid #555;
            color: #cccccc;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #4e4e4e;
            border-color: #666;
        }

        .tool-btn.active {
            background: #0e639c;
            border-color: #1177bb;
            color: white;
        }

        .color-palette {
            display: flex;
            gap: 5px;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: white;
            transform: scale(1.15);
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252526;
            padding: 20px;
        }

        #drawingCanvas {
            background: white;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            border-radius: 4px;
            touch-action: none;
            display: block;
        }

        /* Side Panel */
        .side-panel {
            width: 300px;
            background: #252526;
            border-left: 1px solid #404040;
            overflow-y: auto;
            padding: 20px;
        }

        .panel-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #404040;
        }

        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .control-item {
            margin-bottom: 15px;
        }

        .control-item label {
            display: block;
            font-size: 12px;
            color: #cccccc;
            margin-bottom: 5px;
        }

        .control-item input[type="range"] {
            width: 100%;
            height: 4px;
            background: #3e3e3e;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .control-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #1177bb;
            border-radius: 50%;
            cursor: pointer;
        }

        .control-item input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #1177bb;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 12px;
            color: #cccccc;
            cursor: pointer;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 8px;
            color: #999;
        }

        .data-row strong {
            color: #cccccc;
        }

        .data-row span {
            font-family: 'Courier New', monospace;
            color: #4ec9b0;
        }

        .action-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #3e3e3e;
            border: 1px solid #555;
            color: #cccccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #4e4e4e;
            border-color: #666;
        }

        .action-btn.primary {
            background: #0e639c;
            border-color: #1177bb;
            color: white;
        }

        .action-btn.primary:hover {
            background: #1177bb;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="pen">Pen</button>
                <button class="tool-btn" data-tool="eraser">Eraser</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" data-shape="line">Line</button>
                <button class="tool-btn" data-shape="rectangle">Rectangle</button>
                <button class="tool-btn" data-shape="circle">Circle</button>
                <button class="tool-btn" data-shape="triangle">Triangle</button>
            </div>

            <div class="tool-group color-palette">
                <button class="color-btn active" data-color="#000000" style="background: #000000;"></button>
                <button class="color-btn" data-color="#ff0000" style="background: #ff0000;"></button>
                <button class="color-btn" data-color="#00ff00" style="background: #00ff00;"></button>
                <button class="color-btn" data-color="#0000ff" style="background: #0000ff;"></button>
                <button class="color-btn" data-color="#ffff00" style="background: #ffff00;"></button>
                <button class="color-btn" data-color="#ff00ff" style="background: #ff00ff;"></button>
                <button class="color-btn" data-color="#00ffff" style="background: #00ffff;"></button>
                <button class="color-btn" data-color="#ffa500" style="background: #ffa500;"></button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="canvas-area">
                <canvas id="drawingCanvas"></canvas>
            </div>

            <!-- Side Panel -->
            <div class="side-panel">
                <div class="panel-section">
                    <h3>Brush Settings</h3>
                    <div class="control-item">
                        <label>Size: <span id="sizeValue">12</span>px</label>
                        <input type="range" id="brushSize" min="1" max="50" value="12">
                    </div>
                    <div class="control-item">
                        <label>Opacity: <span id="opacityValue">100</span>%</label>
                        <input type="range" id="opacity" min="0" max="100" value="100">
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="pressureSensitive" checked>
                        <label for="pressureSensitive">Pressure Sensitive</label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Session Data</h3>
                    <div class="data-row">
                        <strong>Session ID:</strong>
                        <span id="sessionId">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Strokes:</strong>
                        <span id="strokeCount">0</span>
                    </div>
                    <div class="data-row">
                        <strong>Duration:</strong>
                        <span id="duration">0s</span>
                    </div>
                    <div class="data-row">
                        <strong>Input:</strong>
                        <span id="inputType">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Pressure:</strong>
                        <span id="pressure">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Tilt X/Y:</strong>
                        <span id="tilt">-</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Sensors</h3>
                    <div class="data-row">
                        <strong>Accel X/Y/Z:</strong>
                        <span id="accelerometer">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Gyro X/Y/Z:</strong>
                        <span id="gyroscope">-</span>
                    </div>
                    <div class="data-row">
                        <strong>Refresh Rate:</strong>
                        <span id="refreshRate">-</span>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Actions</h3>
                    <button class="action-btn" id="undoBtn">Undo</button>
                    <button class="action-btn" id="clearBtn">Clear Canvas</button>
                    <button class="action-btn primary" id="saveBtn">Save Session (JSON)</button>
                    <button class="action-btn" id="exportPngBtn">Export PNG</button>
                </div>
            </div>
        </div>
    </div>

    <script src="advanced-final.js"></script>
</body>
</html>
